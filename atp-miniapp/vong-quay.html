<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vòng Quay May Mắn — An Thái Phú Steel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: #14171a;
    --panel: #1b1f23;
    --panel-raised: #21262b;
    --line: #2b3238;
    --ink: #e9ebe8;
    --ink-dim: #8b959c;
    --amber: #d99a3d;
    --amber-dim: #8a6a3a;
    --steel: #4a7c96;
    --danger: #c1553f;
    --ok: #5a9c6e;
    --radius: 3px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  .page { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 0 0 40px; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .back-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .topbar-title { font-family: 'Oswald', sans-serif; font-size: 15px; }

  .center-msg {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 30px; text-align: center;
  }
  .center-msg .icon { font-size: 40px; margin-bottom: 16px; }
  .center-msg .title { font-family: 'Oswald', sans-serif; font-size: 17px; margin-bottom: 8px; }
  .center-msg .text { color: var(--ink-dim); font-size: 13.5px; line-height: 1.6; }

  .wheel-wrap {
    display: flex; flex-direction: column; align-items: center;
    padding: 30px 20px 10px;
  }
  .wheel-stage { position: relative; width: 280px; height: 280px; margin-bottom: 22px; }
  .wheel-pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 22px solid var(--amber);
    z-index: 5;
  }
  .wheel-disc {
    width: 280px; height: 280px; border-radius: 50%;
    border: 4px solid var(--panel-raised);
    box-shadow: 0 0 0 2px var(--amber-dim);
    position: relative;
    transition: transform 4.5s cubic-bezier(0.17, 0.87, 0.35, 1);
  }
  .wheel-label {
    position: absolute; top: 50%; left: 50%;
    width: 120px; height: 20px;
    margin-left: 0; margin-top: -10px;
    transform-origin: 0% 50%;
    font-size: 10.5px; font-weight: 600;
    color: #14171a;
    display: flex; align-items: center;
    padding-left: 46px;
  }
  .wheel-hub {
    position: absolute; top: 50%; left: 50%;
    width: 46px; height: 46px;
    margin: -23px 0 0 -23px;
    border-radius: 50%;
    background: var(--amber);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    z-index: 4;
    box-shadow: 0 0 0 4px var(--bg);
  }

  .qq-field { width: 100%; max-width: 320px; margin-bottom: 14px; }
  .qq-field label { display: block; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 6px; }
  .qq-field input {
    width: 100%; background: var(--panel); border: 1px solid var(--line);
    color: var(--ink); padding: 12px; border-radius: var(--radius); font-size: 15px;
  }
  .spin-btn {
    width: 100%; max-width: 320px;
    background: var(--amber); color: #1a1305;
    border: none; padding: 14px;
    border-radius: var(--radius);
    font-family: 'Oswald', sans-serif;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .spin-btn:disabled { opacity: .5; }
  .error-text { color: var(--danger); font-size: 12px; margin-top: 8px; text-align: center; min-height: 16px; }

  .result-screen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
  .result-screen.show { display: flex; }
  .result-icon { font-size: 46px; margin-bottom: 14px; }
  .result-title { font-family: 'Oswald', sans-serif; font-size: 19px; margin-bottom: 8px; }
  .result-prize { color: var(--amber); font-size: 15px; margin-bottom: 18px; }
  .code-box {
    border: 1px dashed var(--amber-dim);
    border-radius: var(--radius);
    padding: 14px 22px;
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--amber);
    margin-bottom: 10px;
  }
  .copy-btn {
    background: none; border: 1px solid var(--line); color: var(--ink-dim);
    padding: 7px 16px; border-radius: 20px; font-size: 12px; cursor: pointer;
    margin-bottom: 20px;
  }
  .result-note { color: var(--ink-dim); font-size: 12.5px; line-height: 1.6; margin-bottom: 22px; max-width: 320px; }
  .result-home { color: var(--steel); font-size: 13px; }

  .hide { display: none !important; }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <a href="index.html" class="back-btn">←</a>
    <div class="topbar-title">🎡 Vòng Quay May Mắn</div>
  </div>

  <div id="loadingMsg" class="center-msg">
    <div class="icon">⏳</div>
    <div class="title">Đang tải chương trình...</div>
  </div>

  <div id="disabledMsg" class="center-msg hide">
    <div class="icon">🎡</div>
    <div class="title">Hiện chưa có chương trình quay số</div>
    <div class="text">An Thái Phú Steel sẽ mở vòng quay ưu đãi vào các đợt khuyến mãi. Quay lại sau nhé!</div>
  </div>

  <div id="spinScreen" class="wheel-wrap hide">
    <div class="wheel-stage">
      <div class="wheel-pointer"></div>
      <div class="wheel-disc" id="wheelDisc">
        <div class="wheel-hub">🔩</div>
      </div>
    </div>
    <div class="qq-field">
      <label>Số điện thoại (mỗi số quay được 1 lần)</label>
      <input type="tel" id="fPhone" placeholder="09xx xxx xxx">
    </div>
    <button class="spin-btn" id="spinBtn">Quay ngay</button>
    <div class="error-text" id="errText"></div>
  </div>

  <div id="resultScreen" class="result-screen">
    <div class="result-icon" id="resultIcon">🎉</div>
    <div class="result-title" id="resultTitle">Chúc mừng!</div>
    <div class="result-prize" id="resultPrize"></div>
    <div class="code-box hide" id="codeBox"></div>
    <button class="copy-btn hide" id="copyBtn">Sao chép mã</button>
    <div class="result-note" id="resultNote"></div>
    <a href="index.html" class="result-home">← Về trang chủ</a>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  if (tg?.themeParams?.bg_color) {
    document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color);
  }

  const PALETTE = ['#d99a3d', '#4a7c96', '#c1553f', '#5a9c6e', '#8a6a3a', '#2b3238'];
  let prizes = [];

  function showOnly(id) {
    ['loadingMsg', 'disabledMsg', 'spinScreen', 'resultScreen'].forEach(x => {
      const el = document.getElementById(x);
      if (x === id) {
        el.classList.remove('hide');
        if (x === 'resultScreen') el.classList.add('show');
      } else {
        el.classList.add('hide');
        if (x === 'resultScreen') el.classList.remove('show');
      }
    });
  }

  function buildWheel(prizeList) {
    const n = prizeList.length;
    const seg = 360 / n;
    const stops = prizeList.map((p, i) => {
      const c = PALETTE[i % PALETTE.length];
      return `${c} ${i * seg}deg ${(i + 1) * seg}deg`;
    }).join(', ');
    const disc = document.getElementById('wheelDisc');
    disc.style.background = `conic-gradient(${stops})`;

    // xoá label cũ (nếu vẽ lại)
    disc.querySelectorAll('.wheel-label').forEach(el => el.remove());
    prizeList.forEach((p, i) => {
      const centerAngle = i * seg + seg / 2;
      const label = document.createElement('div');
      label.className = 'wheel-label';
      label.style.transform = `rotate(${centerAngle}deg)`;
      label.textContent = p.label;
      disc.appendChild(label);
    });
  }

  async function loadConfig() {
    try {
      const res = await fetch('/api/wheel');
      const json = await res.json();
      if (!json.enabled) { showOnly('disabledMsg'); return; }
      prizes = json.prizes || [];
      if (!prizes.length) { showOnly('disabledMsg'); return; }
      buildWheel(prizes);
      showOnly('spinScreen');
    } catch (err) {
      showOnly('disabledMsg');
    }
  }
  loadConfig();

  function showError(msg) {
    document.getElementById('errText').textContent = msg;
  }

  function spinToIndex(idx, totalSegments) {
    return new Promise(resolve => {
      const seg = 360 / totalSegments;
      const centerAngle = idx * seg + seg / 2;
      const extraSpins = 5 * 360;
      const target = extraSpins + ((360 - centerAngle) % 360);
      const disc = document.getElementById('wheelDisc');
      disc.style.transform = `rotate(${target}deg)`;
      setTimeout(resolve, 4600);
    });
  }

  function showResult(data, alreadySpun) {
    document.getElementById('resultTitle').textContent = alreadySpun ? 'Bạn đã quay rồi!' : 'Chúc mừng!';
    document.getElementById('resultIcon').textContent = alreadySpun ? 'ℹ️' : '🎉';
    document.getElementById('resultPrize').textContent = data.prize || '';
    const codeBox = document.getElementById('codeBox');
    const copyBtn = document.getElementById('copyBtn');
    if (data.code) {
      codeBox.textContent = data.code;
      codeBox.classList.remove('hide');
      copyBtn.classList.remove('hide');
    } else {
      codeBox.classList.add('hide');
      copyBtn.classList.add('hide');
    }
    document.getElementById('resultNote').textContent = data.code
      ? 'Gửi mã này cho An Thái Phú Steel khi đặt hàng qua Telegram để áp dụng ưu đãi.'
      : 'Cảm ơn anh/chị đã tham gia. Chúc may mắn lần sau!';
    showOnly('resultScreen');
  }

  document.getElementById('copyBtn').addEventListener('click', () => {
    const code = document.getElementById('codeBox').textContent;
    navigator.clipboard?.writeText(code);
    const btn = document.getElementById('copyBtn');
    const old = btn.textContent;
    btn.textContent = 'Đã sao chép ✓';
    setTimeout(() => { btn.textContent = old; }, 1500);
  });

  document.getElementById('spinBtn').addEventListener('click', async () => {
    const phone = document.getElementById('fPhone').value.trim();
    if (!phone) { showError('Vui lòng nhập số điện thoại.'); return; }
    showError('');

    const btn = document.getElementById('spinBtn');
    btn.disabled = true;
    btn.textContent = 'Đang xử lý...';

    try {
      const res = await fetch('/api/wheel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone,
          telegramUser: tg?.initDataUnsafe?.user ? `@${tg.initDataUnsafe.user.username || ''} (${tg.initDataUnsafe.user.id})` : '',
        }),
      });
      const data = await res.json();

      if (data.enabled === false) { showOnly('disabledMsg'); return; }
      if (data.error) { showError('Có lỗi xảy ra, vui lòng thử lại.'); btn.disabled = false; btn.textContent = 'Quay ngay'; return; }

      if (data.alreadySpun) {
        showResult(data, true);
        return;
      }

      await spinToIndex(data.segmentIndex, data.totalSegments || prizes.length);
      showResult(data, false);
    } catch (err) {
      showError('Gửi thất bại, vui lòng thử lại.');
      btn.disabled = false;
      btn.textContent = 'Quay ngay';
    }
  });
</script>

</body>
</html>
